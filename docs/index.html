<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home | MedSafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      try {
        var saved = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          saved === "dark" ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>

    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body class="min-h-screen bg-background text-text">
    <header class="bg-accent px-6 py-5 text-on-accent">
      <div
        class="mx-auto flex max-w-[1312px] flex-wrap items-center justify-between gap-8"
      >
        <div class="flex items-center gap-4">
          <img src="assets/images/logo.svg" alt="" class="h-[69px] w-[69px]" />
          <p class="text-title font-bold font-heading">MedSafe</p>
        </div>

        <nav
          aria-label="Main navigation"
          class="flex flex-wrap items-center gap-8 font-body text-subheading font-medium"
        >
          <a
            class="rounded hover:underline aria-[current=page]:font-bold aria-[current=page]:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-on-accent"
            href="index.html"
            aria-current="page"
          >
            Home
          </a>
          <a
            class="rounded hover:underline aria-[current=page]:font-bold aria-[current=page]:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-on-accent"
            href="how-it-works.html"
            >How It Works</a
          >
          <a
            class="rounded hover:underline aria-[current=page]:font-bold aria-[current=page]:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-on-accent"
            href="process.html"
            >Process</a
          >
        </nav>

        <button
          type="button"
          data-theme-toggle
          aria-pressed="false"
          class="btn border-on-accent bg-accent text-on-accent focus-visible:outline-4 focus-visible:outline-offset-4 focus-visible:outline-on-accent"
        >
          Dark mode
        </button>
      </div>
    </header>

    <main class="bg-card px-6 py-16">
      <section
        class="mx-auto grid max-w-[1120px] items-center gap-8 md:grid-cols-2"
      >
        <div class="flex flex-col gap-6">
          <h1 class="font-heading text-title font-bold text-text">
            Manage Your Health with Confidence
          </h1>

          <p class="font-body text-body text-text">
            A simple website helping older adults find health information and
            access essential services.
          </p>

          <a
            href="how-it-works.html"
            class="btn w-fit border-accent bg-accent text-on-accent transition-colors duration-150 motion-reduce:transition-none hover:bg-brand-hover active:bg-brand-deep focus-visible:outline-4 focus-visible:outline-offset-4 focus-visible:outline-accent"
          >
            Get Started
          </a>
        </div>
        <img
          src="assets/images/medical-banner.webp"
          alt="Medical and healthcare banner"
          class="w-full max-w-3xl rounded-lg dark:brightness-75"
        />
      </section>
    </main>

    <footer class="bg-card p-4 text-center text-text">
      <p>MedSafe</p>
    </footer>

    <script src="assets/theme.js" defer></script>
  </body>
</html>
